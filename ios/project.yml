name: JarvisIOS
options:
  bundleIdPrefix: com.jarvisassistant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
packages:
  JarvisShared:
    path: .
targets:
  JarvisIOS:
    type: application
    platform: iOS
    sources:
      - path: JarvisIOS
      - path: JarvisIntents
    dependencies:
      - package: JarvisShared
        product: JarvisCore
      - package: JarvisShared
        product: JarvisProtocol
      - target: JarvisWidget
        embed: true
    info:
      path: JarvisIOS/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.jarvisassistant.ios.listen
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - jarvis
        NSMicrophoneUsageDescription: Jarvis 只在你明确开始语音输入后使用麦克风。
        NSSpeechRecognitionUsageDescription: Jarvis 使用语音识别把你主动录制的语音转换为可见文本。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvisassistant.ios
        PRODUCT_NAME: Jarvis
        PRODUCT_MODULE_NAME: JarvisIOS
        CODE_SIGN_ENTITLEMENTS: JarvisIOS/JarvisIOS.entitlements
        CODE_SIGN_STYLE: Automatic
  JarvisWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: JarvisWidget
      - path: JarvisIntents/StartJarvisIntent.swift
    info:
      path: JarvisWidget/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvisassistant.ios.widget
        PRODUCT_MODULE_NAME: JarvisWidgetExtension
        CODE_SIGN_ENTITLEMENTS: JarvisWidget/JarvisWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  JarvisIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JarvisIOSUITests
    dependencies:
      - target: JarvisIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvisassistant.ios-uitests
        PRODUCT_NAME: JarvisIOSUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JarvisIOS
  JarvisIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JarvisIOSTests
    dependencies:
      - target: JarvisIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvisassistant.ios-tests
        PRODUCT_NAME: JarvisIOSTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JarvisIOS:
    build:
      targets:
        JarvisIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: JarvisIOSTests
          parallelizable: false
        - name: JarvisIOSUITests
          parallelizable: false
