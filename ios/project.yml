name: JarvisIOS
options:
  bundleIdPrefix: com.jarvisassistant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  JarvisShared:
    path: .
targets:
  JarvisIOS:
    type: application
    platform: iOS
    sources:
      - path: JarvisIOS
    dependencies:
      - package: JarvisShared
        product: JarvisCore
      - package: JarvisShared
        product: JarvisProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvisassistant.ios
        PRODUCT_NAME: Jarvis
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
  JarvisIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JarvisIOSUITests
    dependencies:
      - target: JarvisIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvisassistant.ios-uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JarvisIOS
schemes:
  JarvisIOS:
    build:
      targets:
        JarvisIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: JarvisIOSUITests
          parallelizable: false
